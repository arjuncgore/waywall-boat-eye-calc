<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Waywall Boat Eye Utils</title>
</head>
<body>
        <h1>Reverse Boat Eye Calculator</h1>
        <form method="POST" id="form1">
            
            <label id="dpi_label" for="dpi">
                DPI:
                <textarea id="dpi_input" name="dpi"></textarea>
            </label>

            <label id="mc_sens_label" for="mc_sens">
                Enter Minecraft Sensitivity (options.txt/standardsettings.txt):
                <textarea id="mc_sens_input" name="mc_sens"></textarea>
            </label>

            <label id="win_sens_label" for="win_sens">
                Enter Windows Sensitivity:
                <textarea id="win_sens_input" name="win_sens"></textarea>
            </label>

                <button type="submit">Calculate</button>
        </form>

</body>
</html>
